name: LessonDeck APK

# lessondeck/ 이 바뀌면 안드로이드 APK(디버그 서명)를 빌드해 아티팩트로 올린다.
on:
  push:
    paths:
      - "lessondeck/**"
      - ".github/workflows/lessondeck-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lessondeck-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lessondeck
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lessondeck/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            lessondeck/android/**/*.gradle*
            lessondeck/android/**/gradle-wrapper.properties

      # 안드로이드 SDK는 ubuntu 러너에 미리 설치되어 있다 (ANDROID_HOME)
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: lessondeck/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        run: |
          name="lessondeck-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # 실제 APK의 서명 인증서 지문 (Google Cloud Android OAuth 클라이언트의 SHA-1과 같아야 한다)
      - name: Print signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "android/app/build/outputs/apk/debug/${{ steps.apk.outputs.name }}" | tee cert.txt
          sha1=$(grep -m1 "SHA-1 digest" cert.txt | awk '{print toupper($NF)}' | sed 's/../&:/g; s/:$//')
          echo "SHA-1: $sha1"
          echo "### APK 서명 SHA-1: \`$sha1\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: lessondeck/android/app/build/outputs/apk/debug/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30
