<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>베트남 독립·분단·통일 지도</title>
<meta name="description" content="프랑스령 인도차이나부터 베트남 사회주의 공화국 성립까지, 베트남의 독립·분단·통일 과정을 움직이는 지도로 따라가는 수업용 웹앱">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one full-bleed map. The event card floats over open sea, labels ride on the map, the timeline sits on the bottom edge. */
:root {
  --sea-a: #081520; --sea-b: #12293b; --grat: rgba(150, 190, 220, .07);
  --land: #1a2633; --land-ic: #223445; --edge: #3a5063; --coast: #5f7f99; --river: #4f7a99;
  --ink: #eef3f6; --ink-2: #a9bac8; --ink-3: #73899c; --sea-ink: #55809f;
  --card: rgba(7, 15, 23, .82); --card-line: rgba(170, 200, 225, .17); --chip: rgba(255, 255, 255, .07);
  --halo: rgba(6, 13, 20, .94); --shade: rgba(3, 9, 15, .55); --fade: rgba(5, 12, 19, .9); --night: #01050a;
  --fr: #5b8def; --jp: #ff6b6b; --north: #e5383b; --south: #f4b63f; --us: #55b4ff; --gold: #ffd166; --stamp: #ff8f8f; --on-c: #ffffff;
  --focus: #ffd166;
  --f-display: "Hahmlet", "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --tl-h: 96px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --sea-a: #bccfdd; --sea-b: #e0ebf2; --grat: rgba(30, 70, 100, .09);
    --land: #e9ecea; --land-ic: #fbfbf9; --edge: #a9b7c2; --coast: #7f97ab; --river: #82a9c4;
    --ink: #101c27; --ink-2: #43576a; --ink-3: #74889a; --sea-ink: #5a819e;
    --card: rgba(255, 255, 255, .9); --card-line: rgba(20, 45, 70, .15); --chip: rgba(15, 35, 55, .06);
    --halo: rgba(255, 255, 255, .96); --shade: rgba(40, 70, 100, .18); --fade: rgba(232, 240, 246, .94); --night: #0b1b2b;
    --fr: #2d63d2; --jp: #e03131; --north: #d42a2f; --south: #e09b00; --us: #1a78cf; --gold: #c98c00; --stamp: #c92a2a; --on-c: #ffffff;
    --focus: #c98c00;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --sea-a: #bccfdd; --sea-b: #e0ebf2; --grat: rgba(30, 70, 100, .09);
  --land: #e9ecea; --land-ic: #fbfbf9; --edge: #a9b7c2; --coast: #7f97ab; --river: #82a9c4;
  --ink: #101c27; --ink-2: #43576a; --ink-3: #74889a; --sea-ink: #5a819e;
  --card: rgba(255, 255, 255, .9); --card-line: rgba(20, 45, 70, .15); --chip: rgba(15, 35, 55, .06);
  --halo: rgba(255, 255, 255, .96); --shade: rgba(40, 70, 100, .18); --fade: rgba(232, 240, 246, .94); --night: #0b1b2b;
  --fr: #2d63d2; --jp: #e03131; --north: #d42a2f; --south: #e09b00; --us: #1a78cf; --gold: #c98c00; --stamp: #c92a2a; --on-c: #ffffff;
  --focus: #c98c00;
  color-scheme: light;
}

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--sea-a); color: var(--ink); font-family: var(--f-body); word-break: keep-all; overflow-wrap: break-word; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

#app { position: fixed; inset: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
.s-a { stop-color: var(--sea-a); } .s-b { stop-color: var(--sea-b); }
.b0 { stop-color: var(--north); stop-opacity: .62; } .b1 { stop-color: var(--north); stop-opacity: 0; }
.pf-fr { fill: var(--fr); } .pf-jp { fill: var(--jp); }

.grat { fill: none; stroke: var(--grat); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }
.land { fill: var(--land); stroke: none; transition: fill .6s; }
.land.ic { fill: var(--land-ic); }
#g-vn, #g-la, #g-kh, #g-other { vector-effect: non-scaling-stroke; }
.border { fill: none; stroke: var(--edge); stroke-width: .8; vector-effect: non-scaling-stroke; pointer-events: none; }
.border.vn { stroke: var(--coast); stroke-width: 1.2; }
.river { fill: none; stroke: var(--river); stroke-width: 1.3; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
#rivers, #terr, #fx, #l17, #night { pointer-events: none; }
.terr { opacity: 0; transition: opacity .9s ease; }
#app.instant .terr, #app.instant #l17, #app.instant #night { transition: none; }
#t-ic { fill: var(--fr); } #t-ich { fill: url(#pat-fr); } #t-jp { fill: url(#pat-jp); }
#t-vn, #t-n, #t-w { fill: var(--north); } #t-s { fill: var(--south); }
#night { fill: var(--night); opacity: 0; transition: opacity 1.2s ease; }
#app.night #night { opacity: .52; }
#l17 { opacity: 0; transition: opacity .6s ease; }
#l17.on { opacity: 1; }
.l17-glow { fill: none; stroke: var(--gold); stroke-opacity: .4; stroke-width: 10; vector-effect: non-scaling-stroke; }
.l17-line { fill: none; stroke: var(--ink); stroke-width: 2.4; vector-effect: non-scaling-stroke; }
.l17-sea { fill: none; stroke: var(--ink); stroke-opacity: .75; stroke-width: 1.4; vector-effect: non-scaling-stroke; stroke-dasharray: 5 5; }

.fxg { transition: opacity .45s ease; }
.fxg.out { opacity: 0; }
.ar-halo { fill: none; stroke: var(--halo); stroke-opacity: .55; stroke-linecap: round; stroke-linejoin: round; }
.ar-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ar-head { stroke: var(--halo); stroke-opacity: .6; stroke-linejoin: round; paint-order: stroke; }
.blob { animation: breathe 3.6s ease-in-out infinite; }
.trail { fill: none; stroke: var(--north); stroke-linecap: round; }
.siege-ring { fill: none; stroke: var(--north); stroke-opacity: .85; }
@keyframes breathe { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }

/* ---------- map overlay (labels, markers, tags) ---------- */
#ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.fxl { transition: opacity .45s ease; }
.fxl.out { opacity: 0; }
.pin { position: absolute; left: 0; top: 0; will-change: transform; }
.pin-in { position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; scale: .9; transition: opacity .5s ease, scale .5s cubic-bezier(.2, .8, .2, 1); }
.pin.on .pin-in { opacity: 1; scale: 1; }
.a-c { transform: translate(-50%, -50%); }
.a-r { transform: translate(14px, -50%); }
.a-l { transform: translate(calc(-100% - 14px), -50%); }
.a-t { transform: translate(-50%, calc(-100% - 14px)); }
.a-b { transform: translate(-50%, 14px); }
.halo { text-shadow: 0 0 2px var(--halo), 0 0 6px var(--halo), 0 0 12px var(--halo); }

.city .pin-in { display: flex; align-items: center; gap: 7px; transform: translate(-5px, -50%); font-size: 13px; font-weight: 600; color: var(--ink); }
.city i { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2.5px var(--halo); }
.city.major .pin-in { font-size: 15px; font-weight: 700; }
.city.major i { width: 10px; height: 10px; }
.rename .old { transition: opacity .6s ease .6s, color .4s ease; text-decoration: line-through; text-decoration-color: transparent; transition-property: opacity, text-decoration-color; }
.rename .new { display: inline-block; max-width: 0; overflow: hidden; opacity: 0; transition: max-width .7s ease 1s, opacity .7s ease 1s; color: var(--gold); font-weight: 800; }
.rename.go .old { text-decoration-color: var(--north); opacity: .45; }
.rename.go .new { max-width: 140px; opacity: 1; }
.country .pin-in { font-size: 12px; font-weight: 600; letter-spacing: .42em; color: var(--ink-3); }
.country.sm .pin-in { font-size: 11px; letter-spacing: .2em; }
.sea .pin-in { font-family: var(--f-display); font-size: 14px; font-weight: 600; letter-spacing: .5em; color: var(--sea-ink); }
.river-l .pin-in { font-size: 11px; font-weight: 600; letter-spacing: .25em; color: var(--river); }
.region .pin-in { font-family: var(--f-display); font-size: 15px; font-weight: 800; letter-spacing: .3em; color: var(--ink-2); }

.tag .pin-in { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 9px; border-radius: 999px; background: var(--card); border: 1px solid var(--card-line); box-shadow: 0 8px 22px var(--shade); font-size: 13.5px; font-weight: 600; color: var(--ink); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.tag i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--ink-2)); flex: none; }
.tag b { font-family: var(--f-mono); font-weight: 600; font-size: 12.5px; color: var(--ink-2); }
.big .pin-in { text-align: center; font-family: var(--f-display); font-weight: 800; font-size: clamp(16px, 1.55vw, 23px); line-height: 1.15; color: var(--ink); }
.big small { display: block; margin-top: 4px; font-family: var(--f-body); font-size: 12.5px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
.stamp .pin-in { transform: translate(-50%, -50%) rotate(-6deg); padding: 5px 11px; border: 2px solid var(--stamp); border-radius: 4px; background: var(--card); color: var(--stamp); font-size: 13.5px; font-weight: 700; scale: 1.9; transition: opacity .25s ease, scale .35s cubic-bezier(.3, 1.6, .5, 1); }
.stamp s { text-decoration-thickness: 2px; }
.counter .pin-in { font-family: var(--f-mono); font-size: 14px; font-weight: 600; padding: 4px 9px; border-radius: 6px; background: var(--card); border: 1px solid var(--card-line); color: var(--ink); }
.counter .pin-in em { font-style: normal; color: var(--ink-3); font-size: 11.5px; margin-left: 6px; }

.mk .pin-in { transform: translate(-50%, -50%); }
.mk .badge { position: relative; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2.5px var(--halo), 0 6px 16px var(--shade); transition: background .5s; }
.mk .badge svg { width: 16px; height: 16px; fill: var(--on-c); }
.mk.lg .badge { width: 42px; height: 42px; }
.mk.lg .badge svg { width: 24px; height: 24px; }
.mk.sq .badge { width: 13px; height: 13px; border-radius: 3px; }
.mk.boat .badge { width: 18px; height: 18px; }
.mk.boat .badge svg { width: 11px; height: 11px; }
.mk.gone .pin-in { opacity: 0; scale: .4; }
.dot .pin-in { transform: translate(-50%, -50%); width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--halo); }
.dot.ember .pin-in { box-shadow: 0 0 0 2px var(--halo), 0 0 14px 3px var(--c); }
.ring { position: absolute; left: 50%; top: 50%; width: var(--r, 60px); height: var(--r, 60px); margin: calc(var(--r, 60px) / -2) 0 0 calc(var(--r, 60px) / -2); border: 2px solid var(--c); border-radius: 50%; animation: ring 2.4s ease-out infinite; pointer-events: none; }
@keyframes ring { from { transform: scale(.25); opacity: .95; } to { transform: scale(1); opacity: 0; } }

.burst .pin-in { opacity: 1; scale: 1; width: 0; height: 0; }
.burst .rg { position: absolute; left: 0; top: 0; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); border: 2px solid var(--c); border-radius: 50%; opacity: 0; animation: burst 1.15s cubic-bezier(.2, .7, .3, 1) var(--d, 0s) both; }
.burst .core { position: absolute; left: 0; top: 0; width: calc(var(--s) * .5); height: calc(var(--s) * .5); margin: calc(var(--s) * -.25) 0 0 calc(var(--s) * -.25); border-radius: 50%; background: radial-gradient(circle, var(--c) 0%, transparent 68%); opacity: 0; animation: flash .8s ease-out var(--d, 0s) both; }
.burst.loop .rg, .burst.loop .core { animation-iteration-count: infinite; animation-duration: 2.6s; }
@keyframes burst { 0% { transform: scale(.08); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
@keyframes flash { 0% { transform: scale(.2); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }

.off .pin-in { transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--card-line); box-shadow: 0 10px 26px var(--shade); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.off .arr { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--chip); }
.off .arr svg { width: 14px; height: 14px; fill: var(--ink); }
.off b { display: block; font-family: var(--f-display); font-size: 15px; font-weight: 800; }
.off small { display: block; font-size: 12px; color: var(--ink-2); margin-top: 1px; }

/* ---------- leader line ---------- */
#lead { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#lead-path { fill: none; stroke: var(--ink-2); stroke-width: 1.3; stroke-dasharray: 1 1; }
#lead-dot { fill: var(--focus); stroke: var(--halo); stroke-width: 2; }
#lead-ring { fill: none; stroke: var(--focus); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: lring 2.2s ease-out infinite; }
@keyframes lring { from { transform: scale(.4); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }

/* ---------- event card ---------- */
#card { position: absolute; z-index: 3; display: grid; gap: 12px; box-sizing: border-box; padding: 22px 24px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--card-line); box-shadow: 0 26px 70px var(--shade); -webkit-backdrop-filter: blur(16px) saturate(1.15); backdrop-filter: blur(16px) saturate(1.15); color: var(--ink); }
#card.narrow { padding: 16px 18px 14px; gap: 9px; max-height: 46%; overflow-y: auto; }
.card-in > * { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms + 80ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.c-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.c-phases { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; letter-spacing: .14em; color: var(--ink-3); }
.c-phases i { width: 12px; height: 1px; background: var(--card-line); }
.c-phases .on { color: var(--ink); }
.c-idx { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.c-date { min-height: 1.3em; font-family: var(--f-mono); font-size: clamp(15px, 1.25vw, 18px); font-weight: 600; letter-spacing: .04em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.c-date.typing::after { content: ""; display: inline-block; width: .55em; height: 2px; margin-left: 3px; vertical-align: middle; background: var(--ink-3); animation: caret .8s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.c-title { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(25px, 2.55vw, 40px); line-height: 1.2; letter-spacing: -.01em; text-wrap: balance; }
.c-vs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 999px; background: var(--chip); font-size: 13.5px; font-weight: 600; color: var(--ink); }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.sep { font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 0 2px; }
.c-body { margin: 0; font-size: clamp(16px, 1.2vw, 18px); line-height: 1.65; color: var(--ink); max-width: 34em; }
.c-loc { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding-top: 10px; border-top: 1px solid var(--card-line); font-size: 12.5px; color: var(--ink-2); }
.c-loc svg { width: 13px; height: 13px; fill: none; stroke: var(--ink-3); stroke-width: 1.6; flex: none; }
.c-co { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
.narrow .c-title { font-size: 22px; }
.narrow .c-body { font-size: 15px; line-height: 1.55; }

.chart { display: grid; gap: 6px; }
.ch-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12px; color: var(--ink-2); }
.ch-head b { font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .bar { fill: var(--us); transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 70ms + 350ms); }
.chart .bar.dim { opacity: .45; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .bar, .chart .bar.hot { opacity: 1; filter: brightness(1.15); }
.chart .base { stroke: var(--ink-3); stroke-width: 1; }
.chart .mark { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
.chart text { fill: var(--ink-2); font-family: var(--f-mono); font-size: 10px; }
.chart text.lab { fill: var(--ink); font-family: var(--f-body); font-size: 10.5px; font-weight: 600; }
.ch-foot { font-size: 11px; color: var(--ink-3); }
@keyframes grow { from { transform: scaleY(0); } }
.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0; padding: 0; list-style: none; }
.steps li { display: flex; align-items: baseline; gap: 6px; padding: 5px 11px; border-radius: 8px; background: var(--chip); font-size: 13px; font-weight: 600; }
.steps li b { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.steps .to { padding: 0; background: none; color: var(--ink-3); font-family: var(--f-mono); }

/* intro card */
#card.intro { left: 50% !important; top: 47% !important; right: auto !important; bottom: auto !important; transform: translate(-50%, -50%); width: min(680px, calc(100% - 32px)) !important; padding: clamp(24px, 4vw, 40px); gap: 16px; }
.i-eyebrow { font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .12em; color: var(--ink-2); }
.i-title { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 5.2vw, 68px); line-height: 1.05; letter-spacing: -.02em; }
.i-title span { color: var(--ink-3); font-weight: 600; }
.i-body { margin: 0; font-size: clamp(15px, 1.3vw, 18px); line-height: 1.65; color: var(--ink-2); max-width: 32em; }
.i-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.i-keys { font-size: 12.5px; color: var(--ink-3); }
.i-keys kbd { font-family: var(--f-mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--card-line); color: var(--ink-2); }
.btn-start { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border: 0; border-radius: 999px; background: var(--ink); color: var(--sea-a); font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .2s ease; }
.btn-start:hover { transform: translateX(3px); }
.btn-start svg { width: 16px; height: 16px; fill: currentColor; }

/* ---------- HUD ---------- */
#brand { position: absolute; z-index: 4; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 2px; pointer-events: none; }
#brand b { font-family: var(--f-display); font-size: 16px; font-weight: 800; }
#brand span { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-3); }
#tools { position: absolute; z-index: 4; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; min-width: 38px; padding: 0 10px; border: 1px solid var(--card-line); border-radius: 999px; background: var(--card); color: var(--ink); cursor: pointer; font-size: 13px; font-weight: 600; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.ibtn:hover { border-color: var(--ink-3); }
.ibtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  const p = pts.map((q) => [f1(q[0]), f1(q[1])]);

function tween(dur, fn, o = {}) {

}
let timers = [];
function at(ms, fn) { if (INSTANT || ms <= 0) { fn(); return; } timers.push(setTimeout(fn, ms)); }

/* ================= camera ================= */
function viewOf(c) { return [(W / 2 - c.x) / c.k, (H / 2 - c.y) / c.k, W / c.k]; }
function camOf(v) { const k = W / v[2]; return { k, x: W / 2 - v[0] * k, y: H / 2 - v[1] * k }; }
function fit(b, zone = Z) {
  const [x0, y0] = P(b[0], b[3]), [x1, y1] = P(b[2], b[1]);
  const k = Math.min(zone.w / (x1 - x0), zone.h / (y1 - y0));
  return { k, x: zone.x + zone.w / 2 - (x0 + x1) / 2 * k, y: zone.y + zone.h / 2 - (y0 + y1) / 2 * k };
}
function zoomInterp(p0, p1) { // van Wijk & Nuij smooth zoom (as in d3.interpolateZoom)
  const rho = 1.25, rho2 = rho * rho, rho4 = rho2 * rho2;
  const [ux0, uy0, w0] = p0, [ux1, uy1, w1] = p1;
  const dx = ux1 - ux0, dy = uy1 - uy0, d2 = dx * dx + dy * dy;
  let i, S2;
  if (d2 < 1e-12) {
    S2 = Math.log(w1 / w0) / rho;
    i = (t) => [ux0 + t * dx, uy0 + t * dy, w0 * Math.exp(rho * t * S2)];
  } else {
    const d1 = Math.sqrt(d2);
    const b0 = (w1 * w1 - w0 * w0 + rho4 * d2) / (2 * w0 * rho2 * d1);
    const b1 = (w1 * w1 - w0 * w0 - rho4 * d2) / (2 * w1 * rho2 * d1);
    const r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0), r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1);
    S2 = (r1 - r0) / rho;
    i = (t) => {
      const s = t * S2, c0 = Math.cosh(r0);
      const u = w0 / (rho2 * d1) * (c0 * Math.tanh(rho * s + r0) - Math.sinh(r0));
      return [ux0 + u * dx, uy0 + u * dy, w0 * c0 / Math.cosh(rho * s + r0)];
    };
  }
  i.duration = Math.abs(S2) * 1000 * rho / Math.SQRT2;
  return i;
}
function flyTo(t) {
  if (INSTANT) { camAnim = null; cam = t; invalidate(); return; }
  const i = zoomInterp(viewOf(cam), viewOf(t));
  camAnim = { i, t0: performance.now(), dur: clamp(i.duration * .8, 1000, 2400) };
  kick();
}

/* ================= render ================= */
function render() {
  world.setAttribute('transform', `translate(${cam.x.toFixed(2)} ${cam.y.toFixed(2)}) scale(${cam.k.toFixed(5)})`);
  const inv = (1 / cam.k).toFixed(5);
  patFr.setAttribute('patternTransform', `rotate(45) scale(${inv})`);
  patJp.setAttribute('patternTransform', `rotate(-45) scale(${inv})`);
  const g = riftAmt * 2.4 / cam.k;
  riftN.setAttribute('transform', `translate(0 ${(-g).toFixed(3)})`);
  riftS.setAttribute('transform', `translate(0 ${g.toFixed(3)})`);
  const ppd = cam.k * KU;
  for (const it of items) {
    if (it.off) continue;
    const x = it.wx * cam.k + cam.x + it.dx, y = it.wy * cam.k + cam.y + it.dy;
    const vis = !it.hidden && ppd >= it.minP && ppd <= it.maxP && x > -400 && x < W + 400 && y > -300 && y < H + 300;
    if (vis !== it.vis) { it.el.style.display = vis ? '' : 'none'; it.vis = vis; }
    if (!vis) continue;
    let px = x;
    if (it.fitX) { // keep callouts inside the screen on narrow viewports
      if (!it.w) it.w = it.inner.offsetWidth;
      const left = it.anchor === 'a-l' ? x - 14 - it.w : it.anchor === 'a-r' ? x + 14 : x - it.w / 2;
      px += clamp(left, 8, Math.max(8, W - 8 - it.w)) - left;
    }
    it.el.style.transform = `translate3d(${px.toFixed(1)}px,${y.toFixed(1)}px,0)`;
  }
  for (const op of offpins) placeOff(op);
  drawLeader();
}

function placeOff(op) {
  const tx = op.wx * cam.k + cam.x, ty = op.wy * cam.k + cam.y;
  const cx = Z.x + Z.w / 2, cy = Z.y + Z.h / 2;
  const ang = Math.atan2(ty - cy, tx - cx), dx = Math.cos(ang), dy = Math.sin(ang);
  const R = { x0: Z.x + 6, y0: Z.y + 4, x1: Z.x + Z.w - 6, y1: Z.y + Z.h - 4 };
  let t = Infinity;
  if (dx > 1e-6) t = Math.min(t, (R.x1 - cx) / dx);
  if (dx < -1e-6) t = Math.min(t, (R.x0 - cx) / dx);
  if (dy > 1e-6) t = Math.min(t, (R.y1 - cy) / dy);
  if (dy < -1e-6) t = Math.min(t, (R.y0 - cy) / dy);
  if (!op.bw) { op.bw = op.it.inner.offsetWidth || 200; op.bh = op.it.inner.offsetHeight || 46; }
  const px = clamp(cx + dx * t, R.x0 + op.bw / 2, R.x1 - op.bw / 2);
  const py = clamp(cy + dy * t, R.y0 + op.bh / 2, R.y1 - op.bh / 2);
  op.it.el.style.transform = `translate3d(${px.toFixed(1)}px,${py.toFixed(1)}px,0)`;
  op.arrow.style.transform = `rotate(${ang}rad)`;
}

function drawLeader() {
  const s = SC[cur];
  const hide = () => { leadPath.style.display = leadDot.style.display = leadRing.style.display = 'none'; };
  if (!s || s.intro || !s.focus || !cardRect || leadProg <= 0) return hide();
  const [wx, wy] = PP(s.focus);
  const fx = wx * cam.k + cam.x, fy = wy * cam.k + cam.y;
  const r = cardRect;
  if (fx < 0 || fx > W || fy < 0 || fy > H || (fx > r.l - 12 && fx < r.r + 12 && fy > r.t - 12 && fy < r.b + 12)) return hide();
  let d;
  if (wide) {
    const ax = r.l, ay = clamp(fy, r.t + 30, r.b - 30), dx = ax - fx;
    if (dx < 40) return hide();
    d = `M${ax} ${ay}C${ax - dx * .45} ${ay} ${fx + dx * .35} ${fy} ${fx + 10} ${fy}`;
  } else {
    const ax = clamp(fx, r.l + 26, r.r - 26), ay = r.t, dy = ay - fy;
    if (dy < 40) return hide();
    d = `M${ax} ${ay}C${ax} ${ay - dy * .45} ${fx} ${fy + dy * .35} ${fx} ${fy + 10}`;
  }
  leadPath.style.display = leadDot.style.display = leadRing.style.display = '';
  leadPath.setAttribute('d', d);
  leadPath.style.strokeDashoffset = 1 - leadProg;
  for (const c of [leadDot, leadRing]) { c.setAttribute('cx', fx); c.setAttribute('cy', fy); }
  leadDot.style.opacity = leadRing.style.opacity = leadProg;
}

/* ================= FX toolkit (per scene) ================= */
function makeFx() {
  fxG = S('g', { class: 'fxg' }, $('#fx'));
  fxL = document.createElement('div'); fxL.className = 'fxl'; ov.appendChild(fxL);
  const G = fxG, L = fxL;
  let clipVN = null;
  const fx = { u: 1 / cam.k, g: G };
  fx.view = (b) => { curView = b; const t = fit(b); fx.u = 1 / t.k; flyTo(t); };
  fx.at = at;
  fx.every = every;
  fx.tween = tween;
  fx.loop = (fn) => { if (!INSTANT && !reduced) { loops.add(fn); kick(); } };
  fx.group = () => S('g', { class: 'fxg' }, G);
  fx.fadeOut = (list, ms = 0) => at(ms, () => {
    for (const x of list) {
      if (!x) continue;
      if (x.el) { x.el.classList.remove('on'); setTimeout(() => removeItem(x), 600); }
      else { x.classList.add('out'); setTimeout(() => x.remove(), 600); }
    }
  });

  fx.arrow = (pts, o = {}) => {
    const u = fx.u, w = (o.w || 4.5) * u;
    let wp = pts.map(PP);
    if (o.bend) wp = bendPts(wp, o.bend);
    const d = smoothD(wp);
    const g = S('g', null, o.parent || G);
    const col = `var(--${o.c || 'north'})`;
    const id = 'mk' + (++uid);
    const mask = S('mask', { id, maskUnits: 'userSpaceOnUse', x: -MW, y: -MH, width: 3 * MW, height: 3 * MH }, g);
    const mp = S('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': w + 14 * u, 'stroke-linecap': 'round' }, mask);
    const body = S('g', { mask: `url(#${id})` }, g);
    S('path', { d, class: 'ar-halo', 'stroke-width': w + 3.5 * u }, body);
    const line = S('path', { d, class: 'ar-line', 'stroke-width': w }, body);
    line.style.stroke = col;
    if (o.dash) line.setAttribute('stroke-dasharray', `${o.dash[0] * u} ${o.dash[1] * u}`);
    const hl = Math.max(w * 3.1, 15 * u), hw = hl * .58;
    const head = S('path', { d: `M0 0L${-hl} ${-hw}L${-hl * .7} 0L${-hl} ${hw}Z`, class: 'ar-head', 'stroke-width': 2 * u }, g);
    head.style.fill = col;
    head.style.opacity = 0;
    const len = line.getTotalLength();
    mp.setAttribute('stroke-dasharray', `${len} ${len}`);
    mp.setAttribute('stroke-dashoffset', len);
    const step = Math.max(.5, 3 * u);
    tween(o.dur || 1300, (t) => {
      mp.setAttribute('stroke-dashoffset', len * (1 - t));
      const s = Math.max(step, len * t);
      const a = line.getPointAtLength(s), b = line.getPointAtLength(s - step);
      head.setAttribute('transform', `translate(${a.x} ${a.y}) rotate(${Math.atan2(a.y - b.y, a.x - b.x) / RAD})`);
      head.style.opacity = t > .01 ? 1 : 0;
    }, { delay: o.delay || 0, ease: o.ease || EASE.out });
    return g;
  };

  fx.area = (ll, rDeg, o = {}) => {
    if (!clipVN) clipVN = S('g', { 'clip-path': 'url(#clip-vn)' }, G);
    const [x, y] = PP(ll);
    const wrap = S('g', null, clipVN);
    wrap.style.opacity = 0;
    const c = S('circle', { cx: x, cy: y, r: rDeg * KU * 1.05, fill: 'url(#blob-n)', class: 'blob' }, wrap);
    c.style.animationDelay = `${-Math.random() * 3}s`;
    tween(1200, (t) => { wrap.style.opacity = t; }, { delay: o.delay || 0 });
    return wrap;
  };

  fx.trail = (o = {}) => {
    const u = fx.u;
    const pts = [[105.68, 18.67], [105.82, 17.7], [106.2, 16.95], [106.25, 16.3], [106.45, 15.6], [106.85, 14.75], [107.25, 13.9], [107.18, 13.0], [106.82, 12.25], [106.45, 11.72], [106.2, 11.35]];
    const d = smoothD(pts.map(PP));
    const g = S('g', null, G);
    const id = 'mk' + (++uid);
    const mask = S('mask', { id, maskUnits: 'userSpaceOnUse', x: -MW, y: -MH, width: 3 * MW, height: 3 * MH }, g);
    const mp = S('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': 30 * u, 'stroke-linecap': 'round' }, mask);
    const body = S('g', { mask: `url(#${id})` }, g);
    S('path', { d, class: 'ar-halo', 'stroke-width': 6 * u }, body);
    const p = S('path', { d, class: 'trail', 'stroke-width': 2.8 * u, 'stroke-dasharray': `${7 * u} ${6 * u}` }, body);
    const len = p.getTotalLength();
    mp.setAttribute('stroke-dasharray', `${len} ${len}`);
    mp.setAttribute('stroke-dashoffset', len);
    tween(o.dur || 2200, (t) => mp.setAttribute('stroke-dashoffset', len * (1 - t)), { delay: o.delay || 0, ease: EASE.inOut });
    const period = 13 * u;
    fx.loop((now) => p.setAttribute('stroke-dashoffset', (-(now / 1000) * 26 * u) % period));
    return g;
  };

  const add = (ll, cls, html, o) => item(L, ll, cls, html, o);
  fx.label = (ll, html, cls, o = {}) => show(add(ll, cls, html, o), o.delay || 0);
  fx.region = (ll, text, o = {}) => fx.label(ll, text, 'region', o);
  fx.tag = (ll, html, o = {}) => fx.label(ll, `<i></i><span>${html}</span>`, 'tag', { a: 'a-r', halo: false, ...o });
  fx.big = (ll, title, sub, o = {}) => fx.label(ll, `${title}${sub ? `<small>${sub}</small>` : ''}`, 'big', o);
  fx.stamp = (ll, html, o = {}) => fx.label(ll, html, 'stamp', { halo: false, ...o });
  fx.mk = (ll, icon, o = {}) => {
    const cls = 'mk' + (o.lg ? ' lg' : '') + (o.sq ? ' sq' : '') + (o.cls ? ' ' + o.cls : '');
    const ring = o.pulse ? `<span class="ring" style="--r:${o.lg ? 90 : 64}px"></span>` : '';
    return fx.label(ll, `<span class="badge">${ring}${icon ? iconSvg(icon) : ''}</span>`, cls, { halo: false, c: o.c || 'ink-2', ...o, a: 'a-c' });
  };
  fx.dot = (ll, o = {}) => fx.label(ll, '', 'dot' + (o.ember ? ' ember' : ''), { halo: false, c: o.c || 'north', ...o, a: 'a-c' });
  fx.burst = (ll, o = {}) => {
    if (INSTANT) return null;
    const size = { sm: 34, md: 64, lg: 120, xl: 260 }[o.size || 'md'];
    const it = add(ll, 'burst' + (o.loop ? ' loop' : ''), '<span class="core"></span><span class="rg"></span>', { halo: false, c: o.c || 'north', a: 'a-c' });
    it.el.style.setProperty('--s', size + 'px');
    it.el.style.setProperty('--d', ((o.delay || 0) / 1000) + 's');
    if (!o.loop) setTimeout(() => removeItem(it), (o.delay || 0) + 1400);
    return it;
  };
  fx.off = (ll, name, sub, o = {}) => {
    const it = add(ll, 'off', `<span class="arr"><svg viewBox="-10 -10 20 20"><path d="M-6-5.5 7 0-6 5.5-3.5 0z"/></svg></span><span><b>${name}</b><small>${sub}</small></span>`, { halo: false });
    it.off = true; // positioned by placeOff, not by the normal pass
    const op = { it, wx: it.wx, wy: it.wy, arrow: it.el.querySelector('.arr svg') };
    it.el.style.display = '';
    offpins.push(op);
    show(it, o.delay || 0);
    return it;
  };
  return fx;
}

function retireFx(fast) {
  const g = fxG, l = fxL;
  const old = [...items].filter((it) => l && l.contains(it.el));
  offpins = [];

  const kill = () => { g.remove(); l.remove(); old.forEach((it) => items.delete(it)); };
  if (fast) kill(); else setTimeout(kill, 480);
}

/* Dien Bien Phu siege sequence (runs inside the zoomed view) */
function siege(fx) {
  const C = PL.dbp, LATF = 1.07;
  const posts = [[103.045, 21.412], [103.022, 21.437], [102.998, 21.405], [103.005, 21.392], [103.033, 21.389], [103.035, 21.377], [103.007, 21.375], [103.013, 21.325]];
  const pm = posts.map((p, i) => fx.mk(p, null, { c: 'fr', sq: true, delay: i * 60 }));
  const fort = fx.mk(C, 'fort', { c: 'fr', lg: true, delay: 100 });
  const [cx, cy] = PP(C);
  const ring = S('circle', { cx, cy, r: .125 * KU * LATF, class: 'siege-ring', 'stroke-width': 3 * fx.u, 'stroke-dasharray': `${10 * fx.u} ${7 * fx.u}` }, fx.g);
  ring.style.opacity = 0;
  fx.tween(500, (t) => { ring.style.opacity = t; }, { delay: 200 });
  const guns = [];
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + .2;
    const g = fx.dot([C[0] + Math.cos(a) * .15, C[1] + Math.sin(a) * .15 / LATF], { c: 'north', ember: true, delay: 300 + i * 70 });
    guns.push({ g, a });
  }
  const counter = fx.label([C[0] + .03, C[1] - .085], 'D+1<em>3.13 공격 개시</em>', 'counter', { a: 'a-c', halo: false, delay: 400 });
  const SIEGE = 5600;
  fx.tween(SIEGE, (t) => {
    const r = lerp(.15, .055, t);
    for (const { g, a } of guns) { const [x, y] = PP([C[0] + Math.cos(a) * r, C[1] + Math.sin(a) * r / LATF]); g.wx = x; g.wy = y; }
    ring.setAttribute('r', lerp(.125, .045, t) * KU * LATF);
    const day = Math.max(1, Math.round(t * 56));
    counter.inner.innerHTML = t >= 1 ? 'D+56<em>5.7 프랑스군 항복</em>' : `D+${day}<em>포위 중</em>`;
  }, { delay: 600, ease: EASE.lin });
  const order = [0, 1, 2, 3, 4, 5, 6, 7];
  order.forEach((idx, k) => {
    const d = 600 + (k + 1) * (SIEGE / 9);
    fx.burst(posts[idx], { c: 'gold', size: 'md', delay: d - 200 });
    fx.at(d, () => pm[idx].el.style.setProperty('--c', 'var(--north)'));
  });
  fx.every(260, () => {
    const p = posts[Math.floor(Math.random() * posts.length)];
    fx.burst([p[0] + (Math.random() - .5) * .02, p[1] + (Math.random() - .5) * .02], { c: 'gold', size: 'sm' });
  });
  fx.at(600 + SIEGE, () => {
    clearTimers();
    fort.el.style.setProperty('--c', 'var(--north)');
    fx.burst(C, { c: 'north', size: 'xl' });
    fx.tag(C, '<b>5.7</b> 프랑스군 항복', { c: 'north', a: 'a-l', dx: -18 });
  });
}

function go(i, o = {}) {

  loops.clear();
  retireFx(!!o.instant);
  cur = i;
  INSTANT = !!o.instant || reduced;

  try {
    try { history.replaceState(null, '', '#' + s.id); } catch (e) { /* ignore */ }

  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  mapEl.classList.remove('dragging');
  if (moved <= 3 && e.type === 'pointerup' && e.pointerType !== 'mouse') { hoverTip(e); setTimeout(() => { tip.hidden = true; }, 2200); }
};
mapEl.addEventListener('pointerup', endPtr);
mapEl.addEventListener('pointercancel', endPtr);
mapEl.addEventListener('pointerleave', () => { tip.hidden = true; });
mapEl.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.deltaMode ? .05 : .0016))); }, { passive: false });
mapEl.addEventListener('dblclick', (e) => zoomAt(e.clientX, e.clientY, 1.8));

function regionText(key) {
  const s = SC[cur] || {}, r = s.regions || {};
  const base = { vn: '베트남', la: '라오스', kh: '캄보디아' };
  if (key === 'vn-n' || key === 'vn-s') return r[key] || r.vn || base.vn;
  return r[key] || base[key] || '';
}
function hoverTip(e) {
  const t = e.target, r = t && t.dataset ? t.dataset.r : null;
  if (!r || r === 'other') { tip.hidden = true; return; }
  let key = r;
  if (r === 'vn') { const wy = (e.clientY - cam.y) / cam.k; key = wy < Y17 ? 'vn-n' : 'vn-s'; }
  const text = regionText(key);
  if (!text) { tip.hidden = true; return; }
  tip.textContent = text;
  tip.hidden = false;
  const x = clamp(e.clientX + 16, 8, W - tip.offsetWidth - 8), y = clamp(e.clientY + 16, 8, H - tip.offsetHeight - 8);
  tip.style.transform = `translate(${x}px,${y}px)`;
}

/* ================= boot ================= */
let rsT = 0;
addEventListener('resize', () => {
  clearTimeout(rsT);
  rsT = setTimeout(() => {
    layout();
    if (curView && !userMoved) { camAnim = null; cam = fit(curView); }
    invalidate();
  }, 120);
});
function idFromHash() { const h = (location.hash || '').slice(1); const i = SC.findIndex((s) => s.id === h); return i < 0 ? 0 : i; }
addEventListener('hashchange', () => { const i = idFromHash(); if (i !== cur) go(i); });

layout();
cam = fit([96, 2, 132, 30], { x: 0, y: 0, w: W, h: H });
go(idFromHash());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); invalidate(); });
})();
</script>
