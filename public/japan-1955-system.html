<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일본 55년 체제 의석도</title>
<meta name="description" content="중의원 의석 변화로 일본 55년 체제의 성립과 붕괴, 그 이후를 보여 주는 수업용 웹앱">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one full-bleed stage. The Diet hemicycle is the picture; the year sits in its hollow, party totals hang off its two ends, and the event text sits under its floor. */
:root {
  --bg: #0d1220; --bg-glow: #18213a; --floor: rgba(170, 190, 230, .12);
  --ink: #eef1f7; --ink-2: #a9b3c8; --ink-3: #6f7a93;
  --card: rgba(13, 18, 32, .84); --line: rgba(170, 190, 230, .17); --chip: rgba(255, 255, 255, .07);
  --halo: rgba(13, 18, 32, .95); --shade: rgba(2, 5, 12, .55); --fade: rgba(10, 14, 26, .92);
  --focus: #ffd166;
  --p-ldp: #3987e5; --p-jsp: #e66767; --p-dpj: #d95926; --p-kmt: #c98500; --p-dsp: #9085e9;
  --p-jcp: #d55181; --p-split: #199e70; --p-ishin: #008300; --p-oth: #3e475b; --p-none: #252e44;
  --f-display: "Hahmlet", "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --tl-h: 96px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5f9; --bg-glow: #ffffff; --floor: rgba(30, 50, 90, .1);
    --ink: #111827; --ink-2: #445067; --ink-3: #7b869b;
    --card: rgba(255, 255, 255, .92); --line: rgba(20, 40, 80, .14); --chip: rgba(15, 30, 60, .06);
    --halo: rgba(255, 255, 255, .96); --shade: rgba(40, 60, 100, .16); --fade: rgba(236, 240, 246, .95);
    --focus: #c98c00;
    --p-ldp: #2a78d6; --p-jsp: #e34948; --p-dpj: #eb6834; --p-kmt: #eda100; --p-dsp: #6250d6;
    --p-jcp: #e87ba4; --p-split: #1baf7a; --p-ishin: #008300; --p-oth: #c3cad6; --p-none: #dde2ea;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f5f9; --bg-glow: #ffffff; --floor: rgba(30, 50, 90, .1);
  --ink: #111827; --ink-2: #445067; --ink-3: #7b869b;
  --card: rgba(255, 255, 255, .92); --line: rgba(20, 40, 80, .14); --chip: rgba(15, 30, 60, .06);
  --halo: rgba(255, 255, 255, .96); --shade: rgba(40, 60, 100, .16); --fade: rgba(236, 240, 246, .95);
  --focus: #c98c00;
  --p-ldp: #2a78d6; --p-jsp: #e34948; --p-dpj: #eb6834; --p-kmt: #eda100; --p-dsp: #6250d6;
  --p-jcp: #e87ba4; --p-split: #1baf7a; --p-ishin: #008300; --p-oth: #c3cad6; --p-none: #dde2ea;
  color-scheme: light;
}

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); word-break: keep-all; overflow-wrap: break-word; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#app { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.g0 { stop-color: var(--bg-glow); } .g1 { stop-color: var(--bg); }

/* hemicycle */
.floor { fill: none; stroke: var(--floor); stroke-width: 1; }
.floor-base { stroke: var(--line); stroke-width: 1.5; }
.seat { stroke-width: 0; transition: fill .55s ease, stroke .55s ease, transform .95s cubic-bezier(.3, .7, .2, 1), opacity .5s ease; }
.seat.off { opacity: 0; }
.seat.dim { opacity: .18; }
#seats { transition: opacity .6s ease; }
#seats.gone { opacity: 0; }
#app.instant .seat, #app.instant .ov-item, #app.instant .end { transition: none !important; }
.tline { fill: none; stroke: var(--ink-2); stroke-width: 1.4; stroke-dasharray: 5 4; }
.tline.gold { stroke: var(--focus); stroke-width: 2; stroke-dasharray: none; }

/* overlay items */
#ov { position: absolute; inset: 0; pointer-events: none; }
.ov-item { position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; transition: opacity .5s ease, translate .5s ease; }
.ov-item.on { opacity: 1; }
.halo { text-shadow: 0 0 3px var(--halo), 0 0 8px var(--halo), 0 0 14px var(--halo); }
.wl { display: flex; align-items: baseline; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.wl i { align-self: center; width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.wl i.ring { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.wl b { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.wl small { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
.ll { font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.ll.gold { color: var(--ink); }
.ll.gold::before { content: ""; display: inline-block; width: 8px; height: 2px; margin-right: 5px; vertical-align: middle; background: var(--focus); }

#hollow { position: absolute; display: grid; justify-items: center; align-content: end; gap: 4px; text-align: center; pointer-events: none; }
.h-year { font-family: var(--f-display); font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.h-sub { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-2); letter-spacing: .02em; }
#hollow.mini .h-sub { display: none; }
#hollow.mini .h-doc { transform: scale(.8); transform-origin: 50% 100%; }
.h-doc { display: grid; gap: 7px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); text-align: left; }
.h-doc b { font-family: var(--f-display); font-size: 15px; }
.h-doc span { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; }
.h-doc em { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-style: normal; font-family: var(--f-mono); font-size: 12px; font-weight: 600; border: 2px solid currentColor; }
.h-doc .o { color: var(--p-ldp); } .h-doc .x { color: var(--p-jsp); }
.swap { animation: swap .5s ease both; }
@keyframes swap { from { opacity: 0; transform: translateY(6px); } }

.end { position: absolute; display: grid; gap: 2px; white-space: nowrap; transition: opacity .5s ease; }
.end.ar { text-align: right; justify-items: end; }
.end .nm { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; }
.end.ar .nm { flex-direction: row-reverse; }
.end .nm i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; }
.end .num { font-family: var(--f-display); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.end .num small { font-family: var(--f-body); font-size: .32em; font-weight: 600; color: var(--ink-2); margin-left: 3px; }
.end .meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
.end .sub { font-size: 12px; font-weight: 600; color: var(--ink-2); }

.note { position: absolute; box-sizing: border-box; display: grid; gap: 6px; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 12px 30px var(--shade); white-space: normal; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.note .nh { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .02em; }
.note .nh i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--ink-3)); flex: none; }
.note .nt { font-size: 14.5px; line-height: 1.55; font-weight: 500; color: var(--ink); }
.note { translate: 0 8px; }
.note.on { translate: 0 0; }

/* text block under the floor */
#text { position: absolute; z-index: 2; display: grid; gap: 10px; align-content: start; }
#text > * { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms + 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.t-date { text-align: center; font-family: var(--f-mono); font-size: 14px; font-weight: 600; color: var(--ink-2); letter-spacing: .04em; }
.t-title { margin: 0; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: clamp(24px, 2.5vw, 38px); line-height: 1.2; text-wrap: balance; }
.t-vs { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 999px; background: var(--chip); font-size: 13.5px; font-weight: 600; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.chip i.ring { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.sep { font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--ink-3); }
.t-body { margin: 0 auto; max-width: 36em; text-align: center; font-size: clamp(15.5px, 1.18vw, 18px); line-height: 1.65; text-wrap: pretty; }
.t-notes { display: grid; gap: 8px; }
.t-notes .note { position: static; translate: none; opacity: 1; box-shadow: none; padding: 9px 12px; }
.t-notes .note .nt { font-size: 13.5px; }
.t-foot { text-align: center; font-size: 11.5px; color: var(--ink-3); }
.start { justify-self: center; display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .2s; }
.start:hover { transform: translateX(3px); }
.start svg { width: 16px; height: 16px; fill: currentColor; }
.keys { text-align: center; font-size: 12.5px; color: var(--ink-3); }
.keys kbd { font-family: var(--f-mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-2); }
#text.narrow 
/* summary chart */
#chart { transition: opacity .6s ease; }
#chart.hide { opacity: 0; pointer-events: none; }
.c-grid { stroke: var(--line); stroke-width: 1; }
.c-grid.maj { stroke: var(--ink-3); stroke-dasharray: 5 4; }
.c-ax { fill: var(--ink-3); font-family: var(--f-mono); font-size: 11px; }
.c-axl { fill: var(--ink-2); font-family: var(--f-body); font-size: 11.5px; font-weight: 600; }
.c-band { fill: var(--chip); }
.c-bandl { fill: var(--ink-2); font-family: var(--f-body); font-size: 12.5px; font-weight: 700; }
.c-ser { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1 1; }
.c-pt { stroke: var(--bg); stroke-width: 2; }
.c-lab { font-family: var(--f-body); font-size: 13px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.c-ev { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; }
.c-evl { fill: var(--ink-2); font-family: var(--f-body); font-size: 11.5px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.c-cross { stroke: var(--ink-2); stroke-width: 1; }
.c-hit { fill: transparent; }

/* HUD */
#brand { position: absolute; z-index: 4; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 2px; pointer-events: none; }
#brand b { font-family: var(--f-display); font-size: 16px; font-weight: 800; }
#brand span { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; color: var(--ink-3); }
#tools { position: absolute; z-index: 4; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; min-width: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); cursor: pointer; font-size: 13px; font-weight: 600; }
.ibtn:hover { border-color: var(--ink-3); }
.ibtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#tl { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 24px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--fade) 0%, var(--fade) 60%, transparent 100%); }
.nav { flex: none; width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--card); cursor: pointer; }
.nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav:disabled { opacity: .35; cursor: default; }
.tl-grid { position: relative; flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); row-gap: 8px; }
.tl-ph { grid-row: 1; margin: 0 6px; padding-top: 5px; border-top: 1px solid var(--line); text-align: center; font-size: 11.5px; font-weight: 600; letter-spacing: .2em; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-ph.on { color: var(--ink); border-top-color: var(--ink-2); }
.tl-line { grid-row: 2; grid-column: 1 / -1; align-self: start; margin: 10px calc(100% / 24) 0; height: 2px; background: var(--line); border-radius: 2px; }
.tl-prog { height: 100%; width: 0; background: var(--ink-2); border-radius: 2px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.tl-dot { grid-row: 2; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; padding: 4px 0 0; border: 0; background: none; color: var(--ink-3); cursor: pointer; }
.tl-dot .d { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-3); background: var(--bg); transition: transform .3s, background .3s, border-color .3s; }
.tl-dot.past .d { background: var(--ink-2); border-color: var(--ink-2); }
.tl-dot.on .d { background: var(--focus); border-color: var(--focus); transform: scale(1.45); box-shadow: 0 0 0 4px var(--chip); }
.tl-dot .y { font-family: var(--f-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.tl-dot.on .y { color: var(--ink); font-weight: 600; }
.tl-dot .n { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); padding: 5px 9px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s; }
.tl-dot:hover .n, .tl-dot:focus-visible .n { opacity: 1; }
.tl-dot:first-of-type .n { left: 0; transform: none; }
.tl-dot:last-of-type .n { left: auto; right: 0; transform: none; }
#play { position: relative; overflow: hidden; flex: none; height: 42px; }
#play .pbar { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--focus); }
#play.on .pbar { animation: pbar var(--dwell, 9s) linear forwards; }
@keyframes pbar { to { width: 100%; } }
#play .ico-pause { display: none; }
#play.on .ico-pause { display: block; }
#play.on .ico-play { display: none; }
#tip { position: absolute; z-index: 6; left: 0; top: 0; max-width: 260px; padding: 7px 11px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 10px 24px var(--shade); font-size: 13px; font-weight: 600; line-height: 1.45; pointer-events: none; }
#tip b { font-family: var(--f-mono); font-weight: 600; }
#credit { position: absolute; z-index: 4; margin: 0; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tl-h) + 4px); font-size: 10.5px; color: var(--ink-3); pointer-events: none; }

@media (max-width: 819px) {
  #brand span { display: none; }
  #tl { gap: 8px; padding-top: 20px; }
  .tl-dot .y { font-size: 10px; visibility: hidden; }
  .tl-dot.on .y { visibility: visible; }
  .tl-ph { letter-spacing: .04em; font-size: 10px; margin: 0 2px; }
  .nav { width: 38px; height: 38px; }
  #play .lbl, .ibtn .lbl, .tl-dot .n, #credit { display: none; }
  .wl { font-size: 12px; }
  .wl b { font-size: 11.5px; }
  .end .nm { font-size: 12.5px; }
}
@media (max-width: 480px) { #play { display: none; } }
@media (pointer: coarse) { .keys { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>
<div id="app">
  <svg id="stage" role="img" aria-label="일본 중의원 의석 반원 도표">
    <defs><radialGradient id="glow" cx="50%" cy="45%" r="70%"><stop offset="0" class="g0"/><stop offset="1" class="g1"/></radialGradient></defs>
    <rect width="100%" height="100%" fill="url(#glow)"/>
    <g id="floor"></g>
    <g id="seats"></g>
    <g id="lines"></g>
    <g id="chart" class="hide"></g>
  </svg>
  <div id="ov" aria-hidden="true">
    <div id="hollow"></div>
    <div class="end" id="end-l"></div>
    <div class="end" id="end-r"></div>
    <div id="labels"></div>
  </div>
  <section id="text" aria-live="polite"></section>

  <header id="brand"><b>일본 55년 체제의 성립과 붕괴</b><span>중의원 의석으로 읽는 일본 정치 1951–2015</span></header>
  <div id="tools">
    <button class="ibtn" id="theme" type="button" title="밝은 화면 / 어두운 화면 (T)" aria-label="화면 밝기 전환"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button>
    <button class="ibtn" id="fs" type="button" title="전체 화면 (F)" aria-label="전체 화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <nav id="tl" aria-label="사건 타임라인">
    <button class="nav" id="prev" type="button" aria-label="이전 장면"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="tl-grid" id="tl-grid"><div class="tl-line"><div class="tl-prog" id="tl-prog"></div></div></div>
    <button class="nav" id="next" type="button" aria-label="다음 장면"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="ibtn" id="play" type="button" aria-pressed="false" title="자동 재생 (P)"><svg class="ico-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg><svg class="ico-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span class="lbl">자동 재생</span><span class="pbar"></span></button>
  </nav>
  <div id="tip" role="tooltip" hidden></div>
  <p id="credit">의석: 중의원 총선거 결과</p>
</div>
<noscript><p style="position:fixed;inset:auto 16px 16px">이 자료는 JavaScript가 켜져 있어야 동작합니다.</p></noscript>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function S(tag, attrs, parent) { const e = document.createElementNS(NS, tag); if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

/* ================= data ================= */
// Parties. `col` picks the colour token; `ring` draws the seat as an outline (pre-merger factions).
const PARTY = {
  none:  { name: '의석', col: 'none' },
  dem:   { name: '일본 민주당 (보수)', col: 'ldp' },

const MAX = 512, ROWS = 13;
let W = 0, H = 0, L = null, wide = true, cur = -1, curState = null;
const geomCache = new Map();

function geom(N) {
  const key = [N, L.R, L.cx, L.cy].map((v) => v.toFixed(1)).join(':');
  if (geomCache.has(key)) return geomCache.get(key);
  const { cx, cy, R, r } = L;
  const radii = Array.from({ length: ROWS }, (_, i) => r + (R - r) * i / (ROWS - 1));
  const sum = radii.reduce((a, b) => a + b, 0);
  const raw = radii.map((ri) => N * ri / sum);
  const cnt = raw.map(Math.floor);
  let rest = N - cnt.reduce((a, b) => a + b, 0);
  raw.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { cnt[i]++; rest--; } });
  const seats = [];
  radii.forEach((ri, i) => {
    const m = cnt[i];
    for (let k = 0; k < m; k++) {
      const th = m === 1 ? Math.PI / 2 : Math.PI * (1 - k / (m - 1));
      seats.push({ th, rad: ri, x: cx + ri * Math.cos(th), y: cy - ri * Math.sin(th) });
    }
  });
  seats.sort((a, b) => b.th - a.th || a.rad - b.rad);

}

const isWide = () => app.clientWidth >= 900 && app.clientWidth / app.clientHeight > 1.15;
function layout() {

  app.style.setProperty('--tl-h', tlH + 'px');
  const top = 60;
  wide = isWide();
  textEl.classList.toggle('narrow', !wide);
  let R, tw, side = 0, cy;
  const cx = W / 2;
  if (wide) {

    for (let pass = 0; pass < 2; pass++) {
      tw = Math.min(660, Math.max(320, 2 * R - 180));
      textEl.style.width = tw + 'px';
      R = Math.min(rW, 540, H - top - 44 - tlH - textEl.offsetHeight - 34);
    }
    R = Math.max(R, 150);

    endR.style.left = (cx + R - 74) + 'px'; endR.style.right = 'auto';

  } else {

    endR.style.left = 'auto'; endR.style.right = '16px';
    endL.style.top = endR.style.top = (cy + 14) + 'px';
  }
  textEl.style.left = (cx - tw / 2) + 'px';
  L = { cx, cy, R, r: R * .36, side, tw };

function drawFloor() {

/* ================= seats ================= */
const seatEls = [];
for (let i = 0; i < MAX; i++) seatEls.push(S('circle', { class: 'seat off', r: 3, 'data-i': i }, seatsG));
let owners = new Array(MAX).fill(null);

function ownersOf(st) { const o = []; for (const [p, n] of ST[st].parts) for (let j = 0; j < n; j++) o.push(p); return o; }

function applySeats(stKey, focus, instant) {
  const st = ST[stKey], g = geom(st.N), next = ownersOf(stKey);
  let sum = 0, n = 0;
  for (let i = 0; i < st.N; i++) if (owners[i] !== next[i]) { sum += g.seats[i].th; n++; }
  const thc = n ? sum / n : Math.PI / 2;
  for (let i = 0; i < MAX; i++) {
    const el = seatEls[i];
    if (i < st.N) {
      const p = next[i], P = PARTY[p], s = g.seats[i];
      const changed = owners[i] !== p;
      el.style.transitionDelay = instant || !changed ? '0ms' : `${Math.round(Math.abs(s.th - thc) / Math.PI * 1100 + Math.random() * 140)}ms`;
      el.setAttribute('r', g.dot.toFixed(2));
      el.style.transform = `translate(${s.x.toFixed(1)}px,${s.y.toFixed(1)}px)`;
      const col = `var(--p-${P.col})`;
      el.style.fill = P.ring ? 'var(--bg)' : col;
      el.style.stroke = col;
      el.style.strokeWidth = P.ring ? (g.dot * .5).toFixed(2) + 'px' : '0px';
      el.classList.remove('off');
      el.classList.toggle('dim', !!focus && !focus.includes(p));
      owners[i] = p;
    } else { el.classList.add('off'); owners[i] = null; }
  }
}

/* ================= labels, lines, ends ================= */
function rangeOf(stKey, party) { let a = 0; for (const [p, n] of ST[stKey].parts) { if (p === party) return [a, a + n]; a += n; } return null; }

  const maj = Math.floor(N / 2) + 1, two3 = Math.ceil(2 * N / 3);
  if (type === 'maj') return { k: N - maj, text: `과반 ${maj}석` };
  if (type === 'block') return { k: N - two3 + 1, text: `개헌 저지선 1/3 · ${N - two3 + 1}석`, gold: true };
  return { k: N - two3, text: `개헌 발의선 2/3 · ${two3}석`, gold: true };
}
function place(el, th, rad, gap = 0) {
  const { cx, cy } = L;
  const x = cx + rad * Math.cos(th), y = cy - rad * Math.sin(th);
  const deg = th * 180 / Math.PI;
  let tx = '-50%', ty = '-100%';
  if (deg > 108) { tx = `calc(-100% - ${gap}px)`; ty = '-50%'; } else if (deg < 72) { tx = `${gap}px`; ty = '-50%'; }
  if (deg > 160 || deg < 20) ty = '-80%';
  el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(${tx},${ty})`;
}
let labelTimers = [];

    const a = g.seats[clamp(sp.k - 1, 0, N - 1)].th, b = g.seats[clamp(sp.k, 0, N - 1)].th, th = (a + b) / 2;

}

const endState = { l: null, r: null };
function drawEnds(ends, N) {

/* ================= summary chart ================= */
function drawChart(animate) {

  }

  }

  }

  lab(X(2012.96) + 10, Y(294 / 480) + 4, '자민당 61%');

/* ================= navigation ================= */
let INSTANT = false, sceneTimers = [];
function clearSceneTimers() { sceneTimers.forEach(clearTimeout); sceneTimers = []; labelTimers.forEach(clearTimeout); labelTimers = []; }
function applyStateEntry(s, e, instant) {
  INSTANT = instant;
  curState = e;
  applySeats(e.s, e.focus, instant);
  drawEnds(e.ends, ST[e.s].N);
  drawLabels(e.s, e.wl, s.lines, instant ? 0 : 500);
  INSTANT = false;
}
function go(i, o = {}) {
  i = clamp(i, 0, LAST);
  const s = SC[i];
  const instant = !!o.instant || reduced;
  clearSceneTimers();
  cur = i;
  try { history.replaceState(null, '', '#' + s.id); } catch (e) { /* ignore */ }
  if (instant) app.classList.add('instant');
  renderText(s);
  layout();
  INSTANT = instant;
  drawHollow(s.chart ? null : s.hollow);
  drawNotes(s.notes, instant ? 0 : 900);
  INSTANT = false;
  seatsG.classList.toggle('gone', !!s.chart);
  floorG.style.opacity = s.chart ? 0 : 1;
  if (s.chart) {
    linesG.innerHTML = ''; labelsEl.innerHTML = ''; drawEnds(null, 1);
    INSTANT = instant; drawChart(true); INSTANT = false;
    chartG.classList.remove('hide');
  } else {
    chartG.classList.add('hide');
    setTimeout(() => { if (!SC[cur].chart) chartG.innerHTML = ''; }, 650);
    if (instant) applyStateEntry(s, s.states[s.states.length - 1], true);
    else s.states.forEach((e) => {
      if (e.at === 0) applyStateEntry(s, e, false);
      else sceneTimers.push(setTimeout(() => applyStateEntry(s, e, false), e.at));
    });
  }
  updateTimeline();
  if (instant) requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('instant')));
  schedulePlay();
}

function relayout() {
  geomCache.clear();
  app.classList.add('instant');
  layout();
  const s = SC[cur];
  if (s.chart) drawChart(false);
  else if (curState) {
    INSTANT = true;
    applySeats(curState.s, curState.focus, true);
    drawLabels(curState.s, curState.wl, s.lines, 0);
    INSTANT = false;
  }
  INSTANT = true; drawNotes(s.notes, 0); INSTANT = false;
  requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('instant')));
}

const dots = [];
(() => {

  PHASES.forEach((p, i) => { const d = document.createElement('div'); d.className = 'tl-ph'; d.textContent = p; d.style.gridColumn = `${spans[i][0]} / ${spans[i][1]}`; grid.appendChild(d); });

function updateTimeline() {

let playing = false, playTimer = 0;
const playBtn = $('#play');
function schedulePlay() {

  playBtn.classList.remove('on'); void playBtn.offsetWidth;
  if (!playing) return;
  if (cur >= LAST) { setPlaying(false); return; }
  const dwell = SC[cur].dwell || (SC[cur].intro ? 3000 : 10000);
  playBtn.style.setProperty('--dwell', dwell + 'ms');
  playBtn.classList.add('on');
  playTimer = setTimeout(() => go(cur + 1), dwell);
}
function setPlaying(v) { playing = v; playBtn.setAttribute('aria-pressed', String(v)); playBtn.querySelector('.lbl').textContent = v ? '일시 정지' : '자동 재생'; schedulePlay(); }
playBtn.addEventListener('click', () => setPlaying(!playing));
$('#prev').addEventListener('click', () => go(cur - 1));
$('#next').addEventListener('click', () => go(cur + 1));

const root = document.documentElement;
const effectiveTheme = () => root.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
try { const t = localStorage.getItem('jp55-theme'); if (t === 'light' || t === 'dark') root.dataset.theme = t; } catch (e) { /* storage unavailable */ }
function toggleTheme() { const t = effectiveTheme() === 'dark' ? 'light' : 'dark'; root.dataset.theme = t; try { localStorage.setItem('jp55-theme', t); } catch (e) { /* storage unavailable */ } }
$('#theme').addEventListener('click', toggleTheme);
function toggleFs() { try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if (root.requestFullscreen) root.requestFullscreen().catch(() => {}); } catch (e) { /* not available */ } }
$('#fs').addEventListener('click', toggleFs);

document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !(e.target instanceof HTMLButtonElement))) { e.preventDefault(); go(cur + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if (k === 'Home') go(0);
  else if (k === 'End') go(LAST);
  else if (k === 'p' || k === 'P') setPlaying(!playing);
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === 't' || k === 'T') toggleTheme();
});

/* seat tooltip */
const tip = $('#tip');
function tipShow(e, html) {
  tip.innerHTML = html; tip.hidden = false;
  const x = clamp(e.clientX + 16, 8, W - tip.offsetWidth - 8), y = clamp(e.clientY + 16, 8, H - tip.offsetHeight - 8);
  tip.style.transform = `translate(${x}px,${y}px)`;
}
seatsG.addEventListener('pointermove', (e) => {
  const i = +e.target.getAttribute('data-i'), p = owners[i];
  if (!curState || p == null || p === 'none') { tip.hidden = true; return; }
  const rg = rangeOf(curState.s, p), N = ST[curState.s].N, n = rg[1] - rg[0];
  tipShow(e, `${PARTY[p].name}<br><b>${n}석</b> · ${(n / N * 100).toFixed(1)}%`);
});
seatsG.addEventListener('pointerleave', () => { tip.hidden = true; });
seatsG.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') setTimeout(() => { tip.hidden = true; }, 2200); });

let rsT = 0;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(relayout, 120); });
const idFromHash = () => { const h = (location.hash || '').slice(1); const i = SC.findIndex((s) => s.id === h); return i < 0 ? 0 : i; };
addEventListener('hashchange', () => { const i = idFromHash(); if (i !== cur) go(i); });

cur = idFromHash();
layout();
// first frame: seats rise in from the floor, left to right
{ const g = geom(467); seatEls.forEach((el, i) => { const s = g.seats[Math.min(i, 466)]; el.style.transform = `translate(${s.x}px,${L.cy}px)`; el.setAttribute('r', g.dot); }); }
requestAnimationFrame(() => go(cur));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => relayout());
})();
</script>
